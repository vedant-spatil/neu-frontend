server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: unknown paths go to index.html so client routes work on refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite's hashed asset files never change, so cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
